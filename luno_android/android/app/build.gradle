apply plugin: 'com.android.application'

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def releaseSigningReady = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
    .every { keystoreProperties.getProperty(it) }

def qaAppCheckDebugSecret = System.getenv("LUNO_QA_APPCHECK_DEBUG_SECRET") ?: ""
if (qaAppCheckDebugSecret && !(qaAppCheckDebugSecret ==~ /(?i)[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/)) {
    throw new GradleException("LUNO_QA_APPCHECK_DEBUG_SECRET must be a UUID4")
}

android {
    namespace "com.luno.chess"
    compileSdk rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId "com.luno.chess"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 12
        versionName "1.5.7"
        buildConfigField "boolean", "LUNO_BOOT_DIAGNOSTICS", "false"
        buildConfigField "String", "LUNO_APPCHECK_PROVIDER_FACTORY", '"com.google.firebase.appcheck.playintegrity.PlayIntegrityAppCheckProviderFactory"'
        buildConfigField "String", "LUNO_APPCHECK_DEBUG_SECRET", '""'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile rootProject.file(keystoreProperties.getProperty('storeFile'))
                storePassword keystoreProperties.getProperty('storePassword')
                keyAlias keystoreProperties.getProperty('keyAlias')
                keyPassword keystoreProperties.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        debug {
            buildConfigField "String", "LUNO_APPCHECK_PROVIDER_FACTORY", '"com.google.firebase.appcheck.debug.DebugAppCheckProviderFactory"'
        }
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        releaseQa {
            initWith release
            debuggable false
            buildConfigField "boolean", "LUNO_BOOT_DIAGNOSTICS", "true"
            buildConfigField "String", "LUNO_APPCHECK_PROVIDER_FACTORY", '"com.google.firebase.appcheck.debug.DebugAppCheckProviderFactory"'
            buildConfigField "String", "LUNO_APPCHECK_DEBUG_SECRET", '"' + qaAppCheckDebugSecret + '"'
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "com.android.billingclient:billing:9.1.0"
    implementation platform("com.google.firebase:firebase-bom:34.16.0")
    implementation "com.google.firebase:firebase-appcheck"
    debugImplementation "com.google.firebase:firebase-appcheck-debug"
    releaseImplementation "com.google.firebase:firebase-appcheck-playintegrity"
    releaseQaImplementation "com.google.firebase:firebase-appcheck-debug"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
